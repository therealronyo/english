<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ExposureGraph — Interactive Demo</title>
  <style>
    :root {
      --bg: #020617;
      --panel: #0b1220;
      --border: #1e293b;
      --ink: #e2e8f0;
      --muted: #94a3b8;
      --cyan: #22d3ee;
      --emerald: #34d399;
      --orange: #fb923c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: linear-gradient(135deg, var(--bg) 0%, #0a0f1f 100%);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .container { max-width: 1200px; width: 100%; }
    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      letter-spacing: -0.015em;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 32px;
      font-size: 15px;
    }
    .player {
      background: linear-gradient(180deg, var(--panel), #0a1120);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    .viewport {
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #000;
      position: relative;
    }
    .viewport img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .caption {
      min-height: 60px;
      padding: 16px 24px;
      background: rgba(0, 0, 0, 0.4);
      border-top: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink);
    }
    .caption .frame-num {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: #060a13;
      border-top: 1px solid var(--border);
      gap: 16px;
    }
    .timeline {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    .timeline .progress {
      height: 100%;
      background: var(--cyan);
      border-radius: 3px;
      transition: width 0.15s ease;
    }
    button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    button:hover { border-color: var(--cyan); color: var(--cyan); }
    button:active { opacity: 0.8; }
    .play-btn { min-width: 80px; }
    .frame-counter {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .speed-btn.active {
      background: var(--cyan);
      color: var(--bg);
      border-color: var(--cyan);
    }
    @media (max-width: 768px) {
      h1 { font-size: 24px; }
      .controls { flex-wrap: wrap; }
      .timeline { order: 3; flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ExposureGraph Demo</h1>
    <p class="subtitle">Interactive walkthrough of the security exposure graph — play it like a video, pause to explore.</p>
    <div class="player">
      <div class="viewport">
        <img id="viewport" src="" alt="Demo frame" />
      </div>
      <div class="caption">
        <div class="frame-num" id="frameNum"></div>
        <div id="captionText"></div>
      </div>
      <div class="controls">
        <button class="play-btn" id="playBtn">▶ Play</button>
        <div class="timeline" id="timeline">
          <div class="progress" id="progress"></div>
        </div>
        <div class="frame-counter">
          <span id="frameDisplay">1</span> / <span id="frameTotal">6</span>
        </div>
        <div class="speed-control">
          <span style="font-size: 12px; color: var(--muted);">Speed:</span>
          <button class="speed-btn active" data-speed="1">1x</button>
          <button class="speed-btn" data-speed="1.5">1.5x</button>
          <button class="speed-btn" data-speed="2">2x</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const frames = [
      { img: 'demo/demo-frame-000.png', caption: 'Bird\'s-eye view. Six clusters scored by severity. The remediation queue (left) ranks fixes by impact.' },
      { img: 'demo/demo-frame-001.png', caption: 'Toggle "Attack paths" on. Red dashed edges trace the live threats from each entity — the paths attackers could exploit.' },
      { img: 'demo/demo-frame-002.png', caption: 'Toggle "Choke points" lens. Nodes resize by how many attack paths run through them. The biggest one is the highest-leverage fix.' },
      { img: 'demo/demo-frame-003.png', caption: 'Click a node to focus on it. The side panel shows its risk score, vulnerabilities, activity, and which choke point it\'s a gateway to.' },
      { img: 'demo/demo-frame-004.png', caption: 'Press E for Exec view. The graph recedes. A board-ready summary appears: org risk (72/100, improving), 90-day trend, and the top fixes.' },
      { img: 'demo/demo-frame-005.png', caption: 'Back to the graph. One keystroke toggles between analyst/engineer view (the detail) and CISO view (the posture story).' },
    ];

    let currentFrame = 0;
    let playing = false;
    let speed = 1;
    let playInterval = null;
    const frameDuration = 2500; // ms per frame when playing

    const viewport = document.getElementById('viewport');
    const captionText = document.getElementById('captionText');
    const frameNum = document.getElementById('frameNum');
    const playBtn = document.getElementById('playBtn');
    const timeline = document.getElementById('timeline');
    const progress = document.getElementById('progress');
    const frameDisplay = document.getElementById('frameDisplay');
    const frameTotal = document.getElementById('frameTotal');

    document.getElementById('frameTotal').textContent = frames.length;

    function loadFrame(idx) {
      idx = Math.max(0, Math.min(frames.length - 1, idx));
      currentFrame = idx;
      const frame = frames[idx];
      viewport.src = frame.img;
      captionText.textContent = frame.caption;
      frameNum.textContent = `Frame ${idx + 1} of ${frames.length}`;
      frameDisplay.textContent = idx + 1;
      updateProgress();
    }

    function updateProgress() {
      const pct = ((currentFrame + 1) / frames.length) * 100;
      progress.style.width = pct + '%';
    }

    function play() {
      if (playing) return;
      playing = true;
      playBtn.textContent = '⏸ Pause';
      playInterval = setInterval(() => {
        if (currentFrame < frames.length - 1) {
          loadFrame(currentFrame + 1);
        } else {
          stop();
        }
      }, Math.round(frameDuration / speed));
    }

    function stop() {
      playing = false;
      playBtn.textContent = '▶ Play';
      clearInterval(playInterval);
    }

    function toggle() {
      if (playing) stop();
      else play();
    }

    playBtn.onclick = toggle;
    timeline.onclick = (e) => {
      const rect = timeline.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      const idx = Math.floor(pct * frames.length);
      loadFrame(idx);
      if (playing) stop();
    };

    document.querySelectorAll('.speed-btn').forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll('.speed-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        speed = parseFloat(btn.dataset.speed);
      };
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === ' ') { e.preventDefault(); toggle(); }
      else if (e.key === 'ArrowRight') loadFrame(currentFrame + 1);
      else if (e.key === 'ArrowLeft') loadFrame(currentFrame - 1);
    });

    loadFrame(0);
  </script>
</body>
</html>
